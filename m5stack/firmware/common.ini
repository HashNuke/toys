[env]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
board_build.partitions = ../firmware/partitions.csv
upload_port = /dev/cu.usbserial-01CDD34C
upload_speed = 230400
monitor_speed = 115200
lib_extra_dirs = ../firmware/lib
extra_scripts = pre:../firmware/check_runtime.py
build_flags = -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    m5stack/M5Unified@0.2.11
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.3.6
